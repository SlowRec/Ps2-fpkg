name: Windows .exe

# Crea PS-Classics-fPKG.exe en Windows, pasa las pruebas, comprueba que el propio .exe
# genera un PKG válido y lo publica en Releases como la versión de ps2fpkg/__init__.py
# (en cada cambio a main se actualiza el .exe de esa versión).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install --upgrade pip pillow pyinstaller

      - name: Pruebas (con PkgTool real)
        env:
          PS2FPKG_PKGTOOL: tools\win-x64\PkgTool.Core.exe
        run: python -m unittest discover tests -v

      - name: Crear el .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PS-Classics-fPKG
          --icon assets/icon.ico
          --add-data "tools/win-x64;tools/win-x64"
          --add-data "emus;emus"
          ps_classics_fpkg.py

      - name: Probar el .exe (crea PKG de SNES, Dreamcast y GameCube de prueba)
        shell: pwsh
        run: |
          python -c "open('prueba.sfc', 'wb').write(bytes(512 * 1024)); open('prueba.cdi', 'wb').write(bytes(1024 * 1024))"
          python -c "h = bytearray(0x400); h[:6] = b'GALE01'; h[0x1C:0x20] = bytes.fromhex('C2339F3D'); open('prueba.iso', 'wb').write(bytes(h) + bytes(1024 * 1024))"
          foreach ($game in @(@('snes', 'prueba.sfc', 'salida-snes'), @('dc', 'prueba.cdi', 'salida-dc'), @('gc', 'prueba.iso', 'salida-gc'))) {
            $p = Start-Process dist\PS-Classics-fPKG.exe -ArgumentList $game[0], $game[1], '-o', $game[2] -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "El .exe ($($game[0])) terminó con código $($p.ExitCode)" }
            $pkg = Get-ChildItem "$($game[2])\*.pkg"
            if (-not $pkg) { throw "El .exe no creó el PKG de $($game[0])" }
            & tools\win-x64\PkgTool.Core.exe pkg_validate $pkg.FullName | Tee-Object -Variable report
            if ($report -match '\[ERROR\]') { throw "El PKG de $($game[0]) creado por el .exe no pasó la verificación" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PS-Classics-fPKG-windows
          path: dist/PS-Classics-fPKG.exe

      - name: Versión
        id: version
        shell: pwsh
        run: echo "tag=v$(python -c 'import ps2fpkg; print(ps2fpkg.__version__)')" >> $env:GITHUB_OUTPUT

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PS Classics fPKG ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/PS-Classics-fPKG.exe
            TUTORIAL.md
          body: |
            **PS-Classics-fPKG.exe** para Windows: doble clic y listo (no hace falta instalar Python).
            Incluye PkgTool parcheado, eboot_decrypt y los emuladores de NES, SNES, GBA, Genesis,
            Dreamcast y GameCube/Wii.
            **TUTORIAL.md**: guía paso a paso para crear e instalar los juegos de cada consola.
            Si Windows SmartScreen avisa, elige "Más información" → "Ejecutar de todas formas".
